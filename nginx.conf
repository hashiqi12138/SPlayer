# ======================
# 全局配置
# ======================
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log debug;  # 修改为文件路径
pid /var/run/nginx.pid;

# ======================
# 事件模块
# ======================
events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
    accept_mutex on;
    accept_mutex_delay 100ms;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    
    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'Proxy: $proxy_target '
                    'Upstream: $upstream_addr '
                    'Upstream_Status: $upstream_status '
                    'Time: $request_time '
                    'Upstream_Time: $upstream_response_time '
                    'Connection: $upstream_connect_time';
    
    access_log /var/log/nginx/access.log main;  # 修改为文件路径
    
    # 全局解析器设置
    resolver 8.8.8.8 1.1.1.1 [::1] valid=30s;
    resolver_timeout 5s;

    # 固定允许的源列表（请替换为您的实际域名）
    map $http_origin $allow_origin {
        default "";
        # 添加您允许的来源
        "http://localhost:3889" $http_origin;
        "http://localhost:14558" $http_origin;
        "http://lededoor.v6.rocks:3889" $http_origin;
    }

    # 全局跨域配置（OPTIONS预检请求）
    map $request_method $cors_method {
        OPTIONS 11;
        default 0;
    }

    server {
        listen       25884 reuseport backlog=4096 so_keepalive=on;
        listen       [::]:25884 reuseport backlog=4096 so_keepalive=on;
        server_name  localhost;
        client_max_body_size 100M;
        gzip on;
        # 全局跨域响应头
        add_header 'Access-Control-Allow-Origin' $allow_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        add_header 'Access-Control-Max-Age' 1728000 always;  # 20天缓存
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Vary' 'Origin' always;
        
        # 全局隐藏后端CORS头
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Allow-Credentials';


        location / {

            # 处理OPTIONS请求
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            root      /usr/share/nginx/html;
            index     index.html;
            try_files $uri $uri/ /index.html;
        }

        location @rewrites {
            rewrite ^(.*)$ /index.html last;
        }

        # ======================
        # 网易云音乐代理
        # ======================
        location /api/netease/song/url/v1 {
            proxy_buffers           16 64k;
            proxy_buffer_size       128k;
            proxy_busy_buffers_size 256k;
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        X-Forwarded-Host $host;
            proxy_set_header        Connection "";
            proxy_http_version      1.1;

            proxy_pass              http://localhost:3000/song/url/v1;
            
            sub_filter              '"url":"https://music.163.com' '"url":"/music/unblock';
            sub_filter_types        application/json;
            sub_filter_once         off;
        }

        location /api/netease/ {
            proxy_buffers           16 64k;
            proxy_buffer_size       128k;
            proxy_busy_buffers_size 256k;
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        Connection "";
            proxy_http_version      1.1;

            proxy_pass              http://localhost:3000/;
        }

        location /music/unblock/ {
            proxy_pass              https://music.163.com/;
            proxy_buffering         off;
            proxy_request_buffering off;
        }

        # ======================
        # 全路径代理（Query 参数）
        # ======================
        location = /proxy {
            # 获取原始 URL 参数
            set $raw_target $arg_url;
            
            # 验证 URL 格式
            if ($raw_target !~* "^(http|https)://") {
                return 400 "Invalid URL format. Must start with http:// or https://";
            }
            
            # 设置代理目标
            set $proxy_target $raw_target;
            
            # 基本代理头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            
            # SSL/TLS 设置
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_verify off;
            
            # 超时设置（防止 socket hang up）
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
            proxy_ignore_client_abort on;
            
            # 代理请求
            proxy_pass $proxy_target$is_args$args;
        }
        
        # ======================
        # 全路径代理（路径形式）
        # ======================
        location ~ ^/proxy/(?<protocol>https?):/(?<domain>[^/]+)(?<path>/.*)?$ {
            # 构建完整 URL
            set $target $protocol://$domain$path;
            
            # 基本代理头
            proxy_set_header Host $domain;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            
            # SSL/TLS 设置
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_verify off;
            
            # 超时设置（防止 socket hang up）
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
            proxy_ignore_client_abort on;
            
            # 代理请求
            proxy_pass $target$is_args$args;
        }
        
        # 健康检查端点
        location /healthz {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}